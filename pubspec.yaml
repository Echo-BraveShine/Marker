name: marker
description: "轻量级 Markdown 编辑预览工具"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev.

version: 0.0.9+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  file_selector: ^1.0.3
  url_launcher: ^6.3.2
  flutter_math_fork: ^0.7.4
  flutter_inappwebview: ^6.2.0-beta.3

  # Markdown 解析与渲染 - 使用更稳定的 flutter_markdown
  markdown: ^7.3.1
  flutter_markdown: ^0.7.7+1

  # 语法高亮
  highlight: ^0.7.0
  flutter_highlight: ^0.7.0

  # 状态管理
  flutter_riverpod: ^3.5.0
  freezed_annotation: ^3.1.0

  # 本地文件与存储
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  package_info_plus: ^10.2.2

  # 移动端文件选择
  file_picker: ^13.4.1
  image_picker: ^1.0.0
  share_plus: ^13.3.1
  pub_semver: ^2.2.0
  path: ^1.9.1
  crypto: ^3.0.7
  archive: ^4.7.1
  # 0.8.4 with macOS bookmark encoding and delayed-drop position fixes.
  desktop_drop:
    path: third_party/desktop_drop
  pasteboard: ^0.6.1

  # 桌面窗口管理
  window_manager: ^0.5.1

  # 导出
  printing: ^5.15.1

  # Cupertino Icons
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 构建器生成
  build_runner: ^2.15.1
  freezed: ^3.2.0

  # 代码分析
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/branding/marker-light.png
    - assets/branding/marker-dark.png
    - assets/mermaid.min.js
    - assets/mermaid.LICENSE
    - assets/export/
    - assets/export/fonts/
    - assets/fonts/OFL-NotoSansSC.txt

  fonts:
    - family: Marker Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
