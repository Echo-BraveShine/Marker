name: Desktop checks

on:
  push:
    # Feature branches are checked by pull_request or workflow_dispatch.
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  PYTHONUTF8: '1'

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck= -pyflakes=
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  desktop:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-2025
            target: windows
          - os: ubuntu-24.04
            target: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - uses: nuget/setup-nuget@v3
        if: matrix.target == 'windows'
        with:
          nuget-version: '6.14.0'
      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libfontconfig1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev libcurl4-openssl-dev libgl1 libgl1-mesa-dri xvfb xauth dbus-x11
      - run: flutter pub get --enforce-lockfile
      - name: Verify Linux renderer dependency graph
        if: matrix.target == 'linux'
        run: python3 scripts/check_linux_renderer_dependencies.py --project-dir .
      - name: Run platform-specific tests
        if: matrix.target != 'linux'
        run: flutter test --no-pub
      - name: Verify Windows native file drops
        if: matrix.target == 'windows'
        shell: pwsh
        run: ./scripts/ci/test-windows-drop.ps1
      - name: Preserve Windows drop test logs on failure
        if: failure() && matrix.target == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-drop-diagnostics
          path: ${{ runner.temp }}/marker-windows-drop/
          if-no-files-found: ignore
      - name: Verify macOS early drop registration
        if: matrix.target == 'macos'
        run: bash scripts/ci/test-macos-drop.sh
      - name: Verify macOS document export and pagination
        if: matrix.target == 'macos'
        run: bash scripts/ci/test-macos-export.sh
      - name: Verify macOS shared Mermaid resources
        if: matrix.target == 'macos'
        run: bash scripts/ci/test-macos-mermaid.sh
      - name: Verify Linux offline Mermaid and launcher icons
        if: matrix.target == 'linux'
        run: |
          MARKER_MERMAID_FONT_URI="file://$GITHUB_WORKSPACE/assets/fonts/NotoSansSC.ttf" MARKER_MERMAID_FIXTURES="$RUNNER_TEMP/marker-mermaid" flutter test test/mermaid_diagram_test.dart --no-pub
          bash scripts/ci/test-linux-native.sh "$RUNNER_TEMP/marker-mermaid"
      - name: Preserve Linux Mermaid screenshots on failure
        if: failure() && matrix.target == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: linux-mermaid-diagnostics
          path: ${{ runner.temp }}/marker-mermaid/rendered/
          if-no-files-found: ignore
      - run: flutter build ${{ matrix.target }} --debug --no-pub

  mobile:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: android
          - os: macos-latest
            target: ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Set up Java for Android
        if: matrix.target == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock
            .fvmrc
      - name: Set up Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: flutter pub get --enforce-lockfile
      - name: Build Android debug APK
        if: matrix.target == 'android'
        run: flutter build apk --debug --no-pub
      - name: Build iOS simulator app
        if: matrix.target == 'ios'
        run: flutter build ios --simulator --debug --no-pub
