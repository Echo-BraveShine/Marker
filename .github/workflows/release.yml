name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (vX.Y.Z)
        required: true
        type: string
      build_only:
        description: Build artifacts without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Expected stable release tag vX.Y.Z'
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
      - name: Resolve immutable application commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  package:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: universal
          - os: windows-2025
            platform: windows
            arch: x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - name: Checkout current packaging tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          sparse-checkout: |
            .github/release
            scripts
            windows/installer
            windows/runner/resources
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify tag and application version
        id: version
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: python3 release-tools/scripts/release_version.py --project-dir . --tag "$RELEASE_TAG"
      - name: Check runner architecture
        if: matrix.arch != 'universal'
        env:
          RUNNER_ARCHITECTURE: ${{ runner.arch }}
          EXPECTED_ARCHITECTURE: ${{ matrix.arch }}
        run: |
          actual=$(printf '%s' "$RUNNER_ARCHITECTURE" | tr '[:upper:]' '[:lower:]')
          test "$actual" = "$EXPECTED_ARCHITECTURE"
      - run: python3 -m unittest discover -s release-tools/scripts/tests -v
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev libcurl4-openssl-dev libgl1 libgl1-mesa-dri
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Build release
        run: flutter build ${{ matrix.platform }} --release --no-pub
      - name: Package macOS universal ZIP and DMG
        if: matrix.platform == 'macos'
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_BUILD: ${{ steps.version.outputs.build }}
        run: bash release-tools/.github/release/macos.sh
      - name: Package Windows installer and portable ZIP
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_BUILD: ${{ steps.version.outputs.build }}
        run: ./release-tools/.github/release/windows.ps1
      - name: Package Linux TAR and DEB
        if: matrix.platform == 'linux'
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_BUILD: ${{ steps.version.outputs.build }}
        run: bash release-tools/.github/release/linux.sh
      - name: Create SHA256 checksums
        run: python3 release-tools/scripts/release_checksums.py --project-dir . --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: Marker-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [resolve, package]
    if: ${{ github.event_name == 'push' || !inputs.build_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - name: Checkout current packaging tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          sparse-checkout: |
            .github/release
            scripts
            windows/installer
            windows/runner/resources
      - name: Confirm release tag still points to the built commit
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          git fetch --depth=1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" = "$SOURCE_SHA"
      - uses: actions/download-artifact@v7
        with:
          pattern: Marker-*
          path: dist
          merge-multiple: true
      - name: Combine and verify checksums
        run: |
          cat dist/SHA256SUMS-*.txt > dist/SHA256SUMS.txt
          (cd dist && sha256sum --check SHA256SUMS.txt)
          rm dist/SHA256SUMS-*.txt
      - name: Publish or safely resume stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: bash release-tools/.github/release/publish.sh
